<template id="kfile-viewer-modals">
  <div>
    <!-- 新建文件夹 -->
    <div v-if="modalNewFolder" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click.self="closeNewFolderModal" @keydown.escape="closeNewFolderModal">
      <div class="bg-white dark:bg-[#2d2d2d] rounded-xl shadow-xl border border-slate-200 dark:border-neutral-700 p-5 w-full max-w-sm" role="dialog" aria-modal="true" aria-labelledby="modal-new-folder-title">
        <h3 id="modal-new-folder-title" class="text-lg font-semibold text-slate-800 dark:text-neutral-100 mb-3">新建文件夹</h3>
        <input ref="newFolderInputRef" v-model="newFolderName" type="text" placeholder="文件夹名称（不能含 /）" class="w-full px-3 py-2 border border-slate-200 dark:border-neutral-600 rounded-lg bg-white dark:bg-[#1e1e1e] dark:text-neutral-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:focus:ring-indigo-400 outline-none mb-4" @keydown.enter="submitNewFolder">
        <div class="flex justify-end gap-2">
          <button type="button" @click="closeNewFolderModal" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-neutral-600 hover:bg-slate-100 dark:hover:bg-neutral-700 dark:text-neutral-200 cursor-pointer text-sm">取消</button>
          <button type="button" @click="submitNewFolder" class="px-3 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 cursor-pointer text-sm">确定</button>
        </div>
      </div>
    </div>
    <!-- 新建文本文件 -->
    <div v-if="modalNewFile" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click.self="closeNewFileModal" @keydown.escape="closeNewFileModal">
      <div class="bg-white dark:bg-[#2d2d2d] rounded-xl shadow-xl border border-slate-200 dark:border-neutral-700 p-5 w-full max-w-sm" role="dialog" aria-modal="true" aria-labelledby="modal-new-file-title">
        <h3 id="modal-new-file-title" class="text-lg font-semibold text-slate-800 dark:text-neutral-100 mb-3">新建文本文件</h3>
        <input ref="newFileInputRef" v-model="newFileName" type="text" placeholder="文件名（如 readme.txt，不能含 /）" class="w-full px-3 py-2 border border-slate-200 dark:border-neutral-600 rounded-lg bg-white dark:bg-[#1e1e1e] dark:text-neutral-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:focus:ring-indigo-400 outline-none mb-4" @keydown.enter="submitNewFile">
        <div class="flex justify-end gap-2">
          <button type="button" @click="closeNewFileModal" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-neutral-600 hover:bg-slate-100 dark:hover:bg-neutral-700 dark:text-neutral-200 cursor-pointer text-sm">取消</button>
          <button type="button" @click="submitNewFile" class="px-3 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 cursor-pointer text-sm">确定</button>
        </div>
      </div>
    </div>
    <!-- 重命名 -->
    <div v-if="modalRename.show" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click.self="closeRenameModal" @keydown.escape="closeRenameModal">
      <div class="bg-white dark:bg-[#2d2d2d] rounded-xl shadow-xl border border-slate-200 dark:border-neutral-700 p-5 w-full max-w-sm" role="dialog" aria-modal="true" aria-labelledby="modal-rename-title">
        <h3 id="modal-rename-title" class="text-lg font-semibold text-slate-800 dark:text-neutral-100 mb-3">重命名</h3>
        <input ref="renameInputRef" v-model="modalRename.newName" type="text" placeholder="新名称（不能含 /）" class="w-full px-3 py-2 border border-slate-200 dark:border-neutral-600 rounded-lg bg-white dark:bg-[#1e1e1e] dark:text-neutral-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:focus:ring-indigo-400 outline-none mb-4" @keydown.enter="submitRename">
        <div class="flex justify-end gap-2">
          <button type="button" @click="closeRenameModal" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-neutral-600 hover:bg-slate-100 dark:hover:bg-neutral-700 dark:text-neutral-200 cursor-pointer text-sm">取消</button>
          <button type="button" @click="submitRename" class="px-3 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 cursor-pointer text-sm">确定</button>
        </div>
      </div>
    </div>
    <!-- 复制 / 移动 -->
    <div v-if="modalCopyMove.show" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click.self="closeCopyMoveModal" @keydown.escape="closeCopyMoveModal">
      <div class="bg-white dark:bg-[#2d2d2d] rounded-xl shadow-xl border border-slate-200 dark:border-neutral-700 p-5 w-full max-w-md" role="dialog" aria-modal="true" aria-labelledby="modal-copy-move-title">
        <h3 id="modal-copy-move-title" class="text-lg font-semibold text-slate-800 dark:text-neutral-100 mb-3">{{ modalCopyMove.mode === 'move' ? '移动' : '复制' }}{{ modalCopyMove.isFolder ? '文件夹' : '文件' }}</h3>
        <p class="text-xs text-slate-500 dark:text-neutral-400 mb-3 truncate" :title="modalCopyMove.target">{{ modalCopyMove.target }}</p>
        <label class="block text-sm text-slate-600 dark:text-neutral-300 mb-1" for="copy-move-folder">目标文件夹</label>
        <input id="copy-move-folder" ref="copyMoveFolderInputRef" v-model="modalCopyMove.destinationFolder" list="kfile-known-folders" type="text" placeholder="根目录留空" class="w-full px-3 py-2 border border-slate-200 dark:border-neutral-600 rounded-lg bg-white dark:bg-[#1e1e1e] dark:text-neutral-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:focus:ring-indigo-400 outline-none mb-3" @keydown.enter="submitCopyMove">
        <datalist id="kfile-known-folders">
          <option v-for="folder in knownFolders" :key="folder || 'root'" :value="folder">{{ folder || '根目录' }}</option>
        </datalist>
        <label class="block text-sm text-slate-600 dark:text-neutral-300 mb-1" for="copy-move-name">名称</label>
        <input id="copy-move-name" v-model="modalCopyMove.targetName" type="text" placeholder="名称（不能含 /）" class="w-full px-3 py-2 border border-slate-200 dark:border-neutral-600 rounded-lg bg-white dark:bg-[#1e1e1e] dark:text-neutral-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:focus:ring-indigo-400 outline-none mb-4" @keydown.enter="submitCopyMove">
        <div class="flex justify-end gap-2">
          <button type="button" @click="closeCopyMoveModal" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-neutral-600 hover:bg-slate-100 dark:hover:bg-neutral-700 dark:text-neutral-200 cursor-pointer text-sm">取消</button>
          <button type="button" @click="submitCopyMove" class="px-3 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 cursor-pointer text-sm">确定</button>
        </div>
      </div>
    </div>
    <!-- 删除确认 -->
    <div v-if="modalDelete.show" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click.self="closeDeleteModal" @keydown.escape="closeDeleteModal">
      <div class="bg-white dark:bg-[#2d2d2d] rounded-xl shadow-xl border border-slate-200 dark:border-neutral-700 p-5 w-full max-w-sm" role="dialog" aria-modal="true" aria-labelledby="modal-delete-title">
        <h3 id="modal-delete-title" class="text-lg font-semibold text-slate-800 dark:text-neutral-100 mb-2">确认删除</h3>
        <p class="text-slate-600 dark:text-neutral-400 text-sm mb-4">{{ modalDelete.isFolder ? '将删除该文件夹及其下所有内容。' : '将删除该文件。' }} 是否继续？</p>
        <div class="flex justify-end gap-2">
          <button type="button" @click="closeDeleteModal" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-neutral-600 hover:bg-slate-100 dark:hover:bg-neutral-700 dark:text-neutral-200 cursor-pointer text-sm">取消</button>
          <button type="button" @click="submitDelete" class="px-3 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 cursor-pointer text-sm">删除</button>
        </div>
      </div>
    </div>
    <!-- 上传设置 -->
    <div v-if="modalUploadSettings" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click.self="closeUploadSettingsModal" @keydown.escape="closeUploadSettingsModal">
      <div class="bg-white dark:bg-[#2d2d2d] rounded-xl shadow-xl border border-slate-200 dark:border-neutral-700 p-5 w-full max-w-md" role="dialog" aria-modal="true" aria-labelledby="modal-upload-settings-title">
        <h3 id="modal-upload-settings-title" class="text-lg font-semibold text-slate-800 dark:text-neutral-100">上传设置</h3>
        <p class="mt-1 text-sm text-slate-500 dark:text-neutral-400">选择上传文件重名时的处理方式。</p>
        <fieldset class="mt-4 space-y-2">
          <legend class="sr-only">重名文件处理方式</legend>
          <label class="flex items-start gap-3 rounded-lg border border-slate-200 dark:border-neutral-700 p-3 cursor-pointer hover:border-indigo-300 hover:bg-indigo-50/50 dark:hover:border-indigo-700 dark:hover:bg-indigo-950/20 transition-colors duration-200">
            <input ref="uploadSettingsInputRef" v-model="uploadConflictModeDraft" type="radio" name="upload-conflict-mode" value="rename" class="mt-0.5 h-4 w-4 border-slate-300 text-indigo-600 focus:ring-indigo-500">
            <span>
              <span class="block text-sm font-medium text-slate-700 dark:text-neutral-200">自动重命名</span>
              <span class="mt-0.5 block text-xs text-slate-500 dark:text-neutral-400">保留两个文件，并为新文件追加序号。</span>
            </span>
          </label>
          <label class="flex items-start gap-3 rounded-lg border border-slate-200 dark:border-neutral-700 p-3 cursor-pointer hover:border-indigo-300 hover:bg-indigo-50/50 dark:hover:border-indigo-700 dark:hover:bg-indigo-950/20 transition-colors duration-200">
            <input v-model="uploadConflictModeDraft" type="radio" name="upload-conflict-mode" value="overwrite" class="mt-0.5 h-4 w-4 border-slate-300 text-indigo-600 focus:ring-indigo-500">
            <span>
              <span class="block text-sm font-medium text-slate-700 dark:text-neutral-200">覆盖原文件</span>
              <span class="mt-0.5 block text-xs text-slate-500 dark:text-neutral-400">使用新上传的文件替换同名文件。</span>
            </span>
          </label>
          <label class="flex items-start gap-3 rounded-lg border border-slate-200 dark:border-neutral-700 p-3 cursor-pointer hover:border-indigo-300 hover:bg-indigo-50/50 dark:hover:border-indigo-700 dark:hover:bg-indigo-950/20 transition-colors duration-200">
            <input v-model="uploadConflictModeDraft" type="radio" name="upload-conflict-mode" value="skip" class="mt-0.5 h-4 w-4 border-slate-300 text-indigo-600 focus:ring-indigo-500">
            <span>
              <span class="block text-sm font-medium text-slate-700 dark:text-neutral-200">跳过同名文件</span>
              <span class="mt-0.5 block text-xs text-slate-500 dark:text-neutral-400">不上传已存在同名文件的项目。</span>
            </span>
          </label>
        </fieldset>
        <div class="mt-5 flex justify-end gap-2">
          <button type="button" @click="closeUploadSettingsModal" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-neutral-600 hover:bg-slate-100 dark:hover:bg-neutral-700 dark:text-neutral-200 focus-visible:ring-2 focus-visible:ring-indigo-500 outline-none transition-colors cursor-pointer text-sm">取消</button>
          <button type="button" @click="submitUploadSettings" class="px-3 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-[#2d2d2d] outline-none transition-colors cursor-pointer text-sm">保存</button>
        </div>
      </div>
    </div>
    <!-- 上传进度 -->
    <div v-if="uploading" class="fixed bottom-4 right-4 z-50 bg-white dark:bg-[#2d2d2d] rounded-xl shadow-xl border border-slate-200 dark:border-neutral-700 p-4 w-72">
      <p class="text-sm font-medium text-slate-700 dark:text-neutral-200 mb-1">上传中…</p>
      <p v-if="uploadTotal > 0" class="text-xs text-slate-500 dark:text-neutral-400 mb-2 truncate" :title="uploadCurrentName">{{ uploadCurrentName || '' }} ({{ uploadCurrentIndex }}/{{ uploadTotal }})</p>
      <p v-if="uploadSkipped" class="text-xs text-amber-600 dark:text-amber-400 mb-2">已跳过 {{ uploadSkipped }} 个同名文件</p>
      <div class="h-2 bg-slate-200 dark:bg-neutral-700 rounded-full overflow-hidden">
        <div class="h-full bg-indigo-600 transition-all duration-300" :style="{ width: uploadProgress + '%' }"></div>
      </div>
    </div>
  </div>
</template>
<script>
  defineComponent('kfile-viewer-modals', {
    template: '#kfile-viewer-modals',
    setup() {
      var store = inject('store');
      var Vue = window.Vue;
      if (Vue && Vue.ref && Vue.watch && Vue.nextTick) {
        var newFolderInputRef = Vue.ref(null), newFileInputRef = Vue.ref(null), renameInputRef = Vue.ref(null), copyMoveFolderInputRef = Vue.ref(null), uploadSettingsInputRef = Vue.ref(null);
        Vue.watch(store.modalNewFolder, function (v) { if (v) Vue.nextTick(function () { var el = newFolderInputRef.value; if (el) el.focus(); }); });
        Vue.watch(store.modalNewFile, function (v) { if (v) Vue.nextTick(function () { var el = newFileInputRef.value; if (el) el.focus(); }); });
        Vue.watch(function () { return store.modalRename && store.modalRename.show; }, function (v) { if (v) Vue.nextTick(function () { var el = renameInputRef.value; if (el) el.focus(); }); });
        Vue.watch(function () { return store.modalCopyMove && store.modalCopyMove.show; }, function (v) { if (v) Vue.nextTick(function () { var el = copyMoveFolderInputRef.value; if (el) el.focus(); }); });
        Vue.watch(store.modalUploadSettings, function (v) { if (v) Vue.nextTick(function () { var el = uploadSettingsInputRef.value; if (el) el.focus(); }); });
        return Object.assign({}, store, { newFolderInputRef: newFolderInputRef, newFileInputRef: newFileInputRef, renameInputRef: renameInputRef, copyMoveFolderInputRef: copyMoveFolderInputRef, uploadSettingsInputRef: uploadSettingsInputRef });
      }
      return store;
    }
  })
</script>
