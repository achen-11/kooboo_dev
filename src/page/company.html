<!-- @k-url /company --> 
<layout id="main"><placeholder id="Main">
    <script env="server">
        var pageJsonLdUrl = k.site.info.makeAbsUrl(k.request.url.split(/[?#]/)[0]);
        var pageJsonLd = {
            name: "About Us | Kooboo",
            description: "Meet the team behind Kooboo and learn about our software development technology, talent development, and approach to sharing knowledge.",
            url: pageJsonLdUrl,
            websiteId: k.site.info.makeAbsUrl("/") + "#website",
            language: k.request.culture || "en",
            organizationId: k.site.info.makeAbsUrl("/") + "#organization",
        };
        k.page.setTitle(pageJsonLd.name);
        k.page.setNameMeta("description", pageJsonLd.description);
        k.state.set("pageJsonLd", pageJsonLd);
    </script>
    <view id="component/summary"></view><view id="component/info"></view><view id="component/join"></view>
    <script env="server">
        var companyPageJsonLd = k.state.get("pageJsonLd");
        companyPageJsonLd.hasPart = ["Component.summary", "Component.info", "Component.join"].map(viewName => {
            var source = k.site.views.get(viewName)?.body || "";
            var content = source.replace(/<(style|script)\b[^>]*>[\s\S]*?<\/\1>/gi, "");
            var heading = content.match(/<h[12]\b[^>]*>([\s\S]*?)<\/h[12]>/i) || content.match(/<p\b[^>]*>([\s\S]*?)<\/p>/i);
            return {
                "@type": "WebPageElement",
                name: k.utils.dom.getText(heading?.[1] || "").replace(/\s+/g, " ").trim(),
                text: k.utils.dom.getText(content).replace(/\s+/g, " ").trim(),
            };
        }).filter(section => section.text);
        companyPageJsonLd.headline = companyPageJsonLd.hasPart[0]?.name || companyPageJsonLd.name;
        companyPageJsonLd.text = companyPageJsonLd.hasPart.map(section => section.text).join(" ");
        k.state.set("pageJsonLd", companyPageJsonLd);
    </script>
    <k-json-ld>
        <type name="AboutPage">
            <property name="@id" value="pageJsonLd.url"></property>
            <property name="url" value="pageJsonLd.url"></property>
            <property name="name" value="pageJsonLd.name"></property>
            <property name="headline" value="pageJsonLd.headline"></property>
            <property name="text" value="pageJsonLd.text"></property>
            <property name="hasPart" value="pageJsonLd.hasPart"></property>
            <property name="description" value="pageJsonLd.description"></property>
            <property name="inLanguage" value="pageJsonLd.language"></property>
            <map as="isPartOf">
                <type name="WebSite">
                    <property name="@id" value="pageJsonLd.websiteId"></property>
                </type>
            </map>
            <map as="mainEntity">
                <type name="Organization">
                    <property name="@id" value="pageJsonLd.organizationId"></property>
                </type>
            </map>
        </type>
    </k-json-ld>
</placeholder></layout>
