<!-- @k-url /download --> 
<layout id="main">
    <placeholder id="Main">
        <script env="server" type="module">
            import { createJsonLdPage, jsonLdLabel, jsonLdText } from "./utils.jsonld-i18n";

            var pageJsonLdUrl = k.site.info.makeAbsUrl(k.request.url.split(/[?#]/)[0]);
            var pageJsonLd = createJsonLdPage({
                url: pageJsonLdUrl,
                websiteId: k.site.info.makeAbsUrl("/") + "#website",
                name: {
                    en: "Download Kooboo Community Version | Kooboo",
                    zh: "下载 Kooboo 社区版 | Kooboo",
                },
                description: {
                    en: "Free to download and run on your own computer or server, without limitations.",
                    zh: "可免费下载并在自己的电脑或服务器上运行，没有限制。",
                },
            });
            pageJsonLd.name = jsonLdLabel("Download_Kooboo_Community_Version", "Download Kooboo Community Version", "下载 Kooboo 社区版") + " | Kooboo";
            pageJsonLd.description = jsonLdLabel(
                "Free_to_download_and_run_on_your_own_computer_or_server,_without_limitations.",
                "Free to download and run on your own computer or server, without limitations.",
                "可免费下载并在自己的电脑或服务器上运行，没有限制。"
            );
            pageJsonLd.softwareId = pageJsonLdUrl + "#software";
            pageJsonLd.softwareName = jsonLdText("Kooboo Community Version", "Kooboo 社区版");
            k.page.setTitle(pageJsonLd.name);
            k.page.setNameMeta("description", pageJsonLd.description);
            k.state.set("pageJsonLd", pageJsonLd);
        </script>
        <view id="site/download/core"></view>
        <script type="module" src="/download.js"></script>

        <k-json-ld>
            <type name="WebPage">
                <property name="@id" value="pageJsonLd.url"></property>
                <property name="url" value="pageJsonLd.url"></property>
                <property name="name" value="pageJsonLd.name"></property>
                <property name="alternateName" value="pageJsonLd.alternateName"></property>
                <property name="headline" value="pageJsonLd.headline"></property>
                <property name="hasPart" value="pageJsonLd.hasPart"></property>
                <property name="description" value="pageJsonLd.description"></property>
                <property name="inLanguage" value="pageJsonLd.language"></property>
                <property name="workTranslation" value="pageJsonLd.workTranslation"></property>
                <map as="isPartOf">
                    <type name="WebSite">
                        <property name="@id" value="pageJsonLd.websiteId"></property>
                    </type>
                </map>
                <map as="mainEntity">
                    <type name="SoftwareApplication">
                        <property name="@id" value="pageJsonLd.softwareId"></property>
                        <property name="name" value="pageJsonLd.softwareName"></property>
                        <property name="description" value="pageJsonLd.description"></property>
                        <property name="url" value="pageJsonLd.url"></property>
                        <property name="applicationCategory" value="'DeveloperApplication'"></property>
                        <property name="operatingSystem" value="'Windows, macOS, Linux'"></property>
                        <property name="isAccessibleForFree" value="true"></property>
                        <property name="downloadUrl" value="pageJsonLd.downloadUrls"></property>
                        <property name="inLanguage" value="pageJsonLd.language"></property>
                    </type>
                </map>
            </type>
        </k-json-ld>
    </placeholder>
</layout>
