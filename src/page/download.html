<!-- @k-url /download --> 
<layout id="main">
    <placeholder id="Main">
        <script env="server">
            var pageJsonLdUrl = k.site.info.makeAbsUrl(k.request.url.split(/[?#]/)[0]);
            var pageJsonLd = {
                name: (k.site.labels.getValue("Download_Kooboo_Community_Version") || "Download Kooboo Community Version") + " | Kooboo",
                description: k.site.labels.getValue("Free_to_download_and_run_on_your_own_computer_or_server,_without_limitations.") || "Free to download and run on your own computer or server, without limitations.",
                url: pageJsonLdUrl,
                websiteId: k.site.info.makeAbsUrl("/") + "#website",
                language: k.request.culture || "en",
                softwareId: pageJsonLdUrl + "#software",
            };
            k.page.setTitle(pageJsonLd.name);
            k.page.setNameMeta("description", pageJsonLd.description);
            k.state.set("pageJsonLd", pageJsonLd);
        </script>
        <view id="site/download/core"></view>
        <script type="module" src="/download.js"></script>

        <k-json-ld>
            <type name="WebPage">
                <property name="@id" value="pageJsonLd.url"></property>
                <property name="url" value="pageJsonLd.url"></property>
                <property name="name" value="pageJsonLd.name"></property>
                <property name="headline" value="pageJsonLd.headline"></property>
                <property name="hasPart" value="pageJsonLd.hasPart"></property>
                <property name="description" value="pageJsonLd.description"></property>
                <property name="inLanguage" value="pageJsonLd.language"></property>
                <map as="isPartOf">
                    <type name="WebSite">
                        <property name="@id" value="pageJsonLd.websiteId"></property>
                    </type>
                </map>
                <map as="mainEntity">
                    <type name="SoftwareApplication">
                        <property name="@id" value="pageJsonLd.softwareId"></property>
                        <property name="name" value="'Kooboo Community Version'"></property>
                        <property name="description" value="pageJsonLd.description"></property>
                        <property name="url" value="pageJsonLd.url"></property>
                        <property name="applicationCategory" value="'DeveloperApplication'"></property>
                        <property name="operatingSystem" value="'Windows, macOS, Linux'"></property>
                        <property name="isAccessibleForFree" value="true"></property>
                        <property name="downloadUrl" value="pageJsonLd.downloadUrls"></property>
                    </type>
                </map>
            </type>
        </k-json-ld>
    </placeholder>
</layout>
