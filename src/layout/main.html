<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Build, run, and scale production-ready websites with Kooboo's AI-powered web development platform.">
    <title>Kooboo</title>
    <link rel="stylesheet" href="/site.css">
</head>
<body>
    <view id="site/common/site-header"></view>
    <main class="min-h-[calc(100vh-132px)]">
        <div k-placeholder="Main"></div>
    </main>
    <view id="site/common/site-footer"></view>
    <script env="server" type="module">
        import { resolveAdminBaseFromToken } from "./utils.admin-url-from-token";

        const adminBaseUrl =
            resolveAdminBaseFromToken(k.account.getAccessToken()) || "/_Admin";
        k.utils.clientJS.setVariable("koobooAdminBaseUrl", { value: adminBaseUrl });
    </script>
    <script src="/site.js"></script>
</body>
</html>
