<script env="server">
    var promptGeneratorCulture = String(
        k.site.multilingual.currentCulture || k.request.culture || "en"
    );
    var promptGeneratorIsChinese =
        promptGeneratorCulture.toLowerCase() === "chinese" ||
        /^zh(?:-|$)/i.test(promptGeneratorCulture);

    function resolvePromptGeneratorLabel(name, enFallback, zhFallback) {
        var fallback = promptGeneratorIsChinese ? zhFallback : enFallback;
        var labelItem = k.site.labels.get(name);
        if (!labelItem) return fallback;

        var directValue =
            labelItem[promptGeneratorCulture] ||
            (promptGeneratorIsChinese && (labelItem.zh || labelItem["zh-CN"] || labelItem.chinese));
        if (directValue && String(directValue).trim()) {
            return String(directValue);
        }

        if (!promptGeneratorIsChinese) {
            var value = k.label(name);
            if (value && value !== name && String(value).trim()) {
                return String(value);
            }
        }

        return fallback;
    }

    var promptGeneratorPlaceholderPrefix = resolvePromptGeneratorLabel(
        "prompt-generator.placeholder-prefix",
        "Describe your website, e.g., ",
        "描述您的网站，例如："
    );
    var promptGeneratorPrompt1 = resolvePromptGeneratorLabel(
        "prompt-generator.prompt-1",
        "A coffee shop site with online ordering",
        "支持在线点单的咖啡店网站"
    );
    var promptGeneratorPrompt2 = resolvePromptGeneratorLabel(
        "prompt-generator.prompt-2",
        "A SaaS dashboard for finance teams",
        "面向财务团队的 SaaS 仪表盘"
    );
    var promptGeneratorPrompt3 = resolvePromptGeneratorLabel(
        "prompt-generator.prompt-3",
        "A portfolio site for a UI designer",
        "UI 设计师的作品集网站"
    );
    var promptGeneratorDefaultPlaceholder = promptGeneratorPlaceholderPrefix + promptGeneratorPrompt1;
    var promptGeneratorPlaceholder = resolvePromptGeneratorLabel(
        "prompt-generator.placeholder",
        promptGeneratorDefaultPlaceholder,
        promptGeneratorDefaultPlaceholder
    );
</script>

<div class="prompt-generator m-4 mb-8 rounded-2xl border border-white/40 p-4" data-placeholder-prefix="Describe your website, e.g., " data-placeholder-prompt-1="A coffee shop site with online ordering" data-placeholder-prompt-2="A SaaS dashboard for finance teams" data-placeholder-prompt-3="A portfolio site for a UI designer" k-attribute="data-placeholder-prefix promptGeneratorPlaceholderPrefix; data-placeholder-prompt-1 promptGeneratorPrompt1; data-placeholder-prompt-2 promptGeneratorPrompt2; data-placeholder-prompt-3 promptGeneratorPrompt3">
    <div class="prompt-generator__panel flex min-h-[183px] flex-col gap-4 rounded-xl bg-[var(--color-white)] p-4">
        <label class="flex min-h-[95px] w-full flex-auto">
            <span class="sr-only">Website prompt</span>
            <textarea class="prompt-generator__input min-h-[95px] w-full flex-auto resize-none border-0 text-[15px] leading-[1.45] text-[#606266] outline-none" rows="4" autocomplete="off" k-attribute="placeholder promptGeneratorPlaceholder" placeholder="Describe your website, e.g., A coffee shop site with online ordering"></textarea>
        </label>
        <div class="prompt-generator__controls flex gap-4">
            <div class="prompt-generator__model gap-2 text-sm text-[#646c7d]">
                <label class="prompt-generator__model-label" hidden="">Model setting:</label>
                <select class="prompt-generator__model-select" aria-label="Model" disabled="">
                    <option value="" k-label="Loading_models...">Loading models...</option>
                </select>
            </div>
            <button class="inline-flex h-10 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-[50px] prompt-generator__btn px-4 py-2.5 text-sm font-medium leading-none text-[var(--color-white)]" type="button" disabled="" k-label="Generate_now">Generate now</button>
        </div>
        <p class="prompt-generator__status text-xs text-[#d92d20]" role="alert" hidden=""></p>
    </div>
</div>
