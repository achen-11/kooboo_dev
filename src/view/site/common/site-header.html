<script env="server" type="module">
    const languageUrls = k.site.multilingual.currentURLs();
    const activeLanguage = languageUrls.find(language => language.isActive);
    const switchLanguage = languageUrls.find(language => !language.isActive && language.URL);
    const hasSwitchLanguage = Boolean(switchLanguage);
    const currentLanguageKey = String(
        (activeLanguage && (activeLanguage.key || activeLanguage.Key)) ||
        k.site.multilingual.currentCulture || "en"
    ).toLowerCase();
    const currentCultureFlagKey =
        currentLanguageKey === "chinese" || /^zh(?:-|$)/.test(currentLanguageKey)
            ? "Chinese"
            : "English";
    const targetLanguageUrl = switchLanguage ? switchLanguage.URL : "";
    // Keep explicit language paths (including /en/) out of automatic href rewriting.
    const requestHost = k.request.headers.get("Host") || k.request.host;
    const switchLanguageUrl = targetLanguageUrl.startsWith("/") &&
        !targetLanguageUrl.startsWith("//") && requestHost
        ? "//" + requestHost + targetLanguageUrl
        : targetLanguageUrl;
    export {
        hasSwitchLanguage,
        currentCultureFlagKey,
        switchLanguageUrl,
    };
</script>

            <nav class="site-header__mobile-panel" aria-label="Mobile navigation">

                <a class="site-header__mobile-link" href="/templates">Market</a>
                <a class="site-header__mobile-link" href="/pricing" k-label="menu.pricing">Price</a>
                <a class="site-header__mobile-link" href="/download">Download</a>
                <a class="site-header__mobile-link" href="https://docs.kooboo.com" target="_blank" rel="noopener" k-label="menu.docs">Doc</a>
                <a k-if="hasSwitchLanguage" class="site-header__mobile-language-link" k-attribute="href switchLanguageUrl" aria-label="Switch language" title="Switch language">
                    <img src="/images/English.svg" k-attribute="src /images/{currentCultureFlagKey}.svg" alt="" width="22" height="22">
                </a>
                <a class="site-header__mobile-claim" href="/_Admin/" k-label="Start now">Start now</a>
            </nav>
        </details>
