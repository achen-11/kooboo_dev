<k-data>
    <query as="koobooCore" source="content" resource="KoobooCore" action="list" export=""></query>
</k-data>

<link rel="preload" as="image" href="/site/home-innovation-hero-background.webp" fetchpriority="high">

<section class="innovation-page bg-[var(--color-white)]" aria-labelledby="innovation-title">
    <div class="innovation-hero px-4">
        <div class="innovation-hero__panel relative mx-auto max-w-[1480px] overflow-hidden">
            <img class="innovation-hero__decor" src="/site/home-innovation-hero-decor.webp" width="2000" height="496" alt="" aria-hidden="true" decoding="async">

            <div class="innovation-hero__content relative z-[1] mx-auto text-center">
                <h1 id="innovation-title" class="innovation-hero__title m-0 font-bold tracking-normal text-[var(--color-title)]" k-label="Innovation.Title">The Core of kooboo</h1>
                <p class="innovation-hero__subtitle mx-auto mb-0 text-[var(--color-body)]" k-label="Innovation.Description">We didn&rsquo;t build another CMS wrapper.We rebuilt the web stack from the kernel, Native binaries, zero dependencies, and extreme machine efficiency</p>
            </div>
        </div>
    </div>

    <div class="innovation-grid mx-auto" aria-label="Kooboo core capabilities">
        <article class="innovation-card" k-for="item in koobooCore" repeat-self="true">
            <img class="innovation-card__icon" k-attribute="src item.Icon" width="48" height="48" alt="" aria-hidden="true">
            <h2 k-content="item.Title">Native experiments</h2>
            <p k-content="item.Description">A/B testing is integrated into the OS kernel.No external scripts or performance hits</p>
            <a class="innovation-card__link" href="/articles/{item.slug}">
                <span k-label="View Detail">View Detail</span>
                <span aria-hidden="true">&rarr;</span>
            </a>
        </article>
    </div>
</section>
