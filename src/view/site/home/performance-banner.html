<k-data>
    <query as="performanceBanner" source="content" resource="PerformanceBanner" action="list" export></query>
</k-data>

<section class="home-performance bg-[var(--color-white)]" aria-labelledby="home-performance-title">
    <div class="site-container">
        <div class="home-performance__stage">
            <img class="home-performance__visual" src="/site/home-performance-visual.webp" width="1352" height="598" alt="" aria-hidden="true" loading="lazy" decoding="async">

            <h2 id="home-performance-title" class="home-performance__title" k-label="Extreme Performance Architecture">Extreme Performance Architecture</h2>

            <div class="home-performance__features" aria-label="Performance architecture capabilities">
                <article class="home-performance-feature" k-for="item in performanceBanner" repeat-self="true">
                    <img class="home-performance-feature__icon" k-attribute="src item.Image" width="32" height="32" alt="" aria-hidden="true">
                    <div>
                        <h3 k-content="item.Title">2000+ Sites / Server</h3>
                        <p k-content="item.Description">Massive density with minimal resource usage.</p>
                    </div>
                </article>
            </div>
        </div>
    </div>
</section>
