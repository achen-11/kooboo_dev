<k-data>
    <query as="startBuilding" source="content" resource="StartBuildingBanner" action="item" export></query>
</k-data>

<section class="home-start-building" aria-labelledby="home-start-building-title">
    <div class="home-start-building__glow" aria-hidden="true">
        <img class="home-start-building__glow-image" src="/site/home-hero-ring.webp" width="1350" height="400" alt="" loading="lazy" decoding="async">
    </div>

    <div class="home-start-building__content">
        <header class="home-start-building__header">
            <h2 id="home-start-building-title" k-content="startBuilding.Title">Start Building Now !</h2>
            <p k-content="startBuilding.Description">No setup. No friction. Just describe and generate.</p>
        </header>

        <div class="home-start-building__prompt">
            <view id="site/common/prompt-generator"></view>
        </div>
    </div>
</section>
