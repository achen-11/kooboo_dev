<k-data>
    <query as="templateCategories" source="content" resource="TemplateCategory" action="list" order="Sort" export></query>
    <query as="templateItems" source="content" resource="TemplateItem" action="list" order="Sort" export></query>
</k-data>

<script env="server">

    var categoryKeysByItemId = {};

    function addTemplateCategory(itemId, categoryKey) {
        if (!categoryKeysByItemId[itemId]) categoryKeysByItemId[itemId] = [];
        categoryKeysByItemId[itemId].push(categoryKey);
    }

    templateCategories.forEach(function (category) {
        category.FilterKey = category.id;
        category.Templates.forEach(function (item) {
            addTemplateCategory(item.id, category.FilterKey);
        });
    });

    var templateDefaultFilter = templateCategories[0].FilterKey;

    templateItems.forEach(function (item) {
        var templateId = String(item.TemplateId || "").trim();
        var previewImage = String(item.PreviewImage || "");
        item.FilterKeys = (categoryKeysByItemId[item.id] || []).join(" ");
        item.OptimizedPreviewImage = previewImage.toLowerCase().lastIndexOf(".png") === previewImage.length - 4
            ? previewImage.slice(0, -4) + ".webp"
            : previewImage;
        item.AdminPath = templateId
            ? "/template/detail?templateId=" + encodeURIComponent(templateId) + "&lang=en"
            : "/templates?lang=en";
        item.AdminHref = "/_Admin" + item.AdminPath;
    });
</script>

<section class="template-gallery" aria-labelledby="template-gallery-title" data-template-gallery k-attribute="data-template-default-filter templateDefaultFilter">
    <div class="template-gallery__inner">
        <div class="template-gallery__filters" role="group" aria-label="Template categories">
            <button class="template-gallery__filter" type="button" aria-pressed="false" k-for="category in templateCategories" repeat-self="true" k-attribute="data-template-filter category.FilterKey" k-content="category.Name">E-commerce</button>
        </div>

        <div class="template-gallery__heading">
            <div>
                <h1 id="template-gallery-title">Choose a starting point and quickly create a website</h1>
                <p>From corporate websites, e-commerce platforms, choose a template to create your website with one click</p>
            </div>
        </div>

        <div class="template-gallery__grid">
            <article class="template-card" data-template-card k-for="item in templateItems" repeat-self="true" k-attribute="data-template-categories item.FilterKeys">
                <div class="template-card__media">
                    <img src="/site/templates/template-fruit.webp" alt="Fruit market ecommerce template preview" width="640" height="400" loading="eager" fetchpriority="high" decoding="async" k-attribute="src item.OptimizedPreviewImage; alt item.AltText">
                    <a class="template-card__action" href="/_Admin/templates?lang=en" target="_blank" data-template-admin-path="/templates?lang=en" k-attribute="href item.AdminHref; data-template-admin-path item.AdminPath" k-label="Use this template">Use this template</a>
                </div>
                <h2 k-content="item.Name">Fresh Market</h2>
            </article>
        </div>
    </div>
</section>
